<!DOCTYPE html>
<html>
    <head>
	    <meta charset="UTF-8">
        <link rel="manifest" href="manifest.json">
        <link rel="stylesheet" href="style.css">
        <title>ProductShowcase</title>
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    
    <body>
        <script src="main.js"></script>

	    <div id="snackbar">this is test</div>
        <div id="authModal" class="modal">
            <div class="modal-content">
                <h3>نیاز به احراز هویت</h3>

                <p>
                    برای دسترسی به این بخش نخست باید 
                    <a href="signup.html">ثبت نام کنید</a>
                    یا اگر حساب دارید
                    <a href="login.html">وارد حسابتان بشید</a>
                </p>
                <button onclick="closeModal()">بستن</button>
            </div>
        </div>

        <div id="selectionPage">
            <h2 id="welcome"></h2>
            <button id="buttonLogin" class="firstButton" onclick="location.href='login.html'">ورود</button>
            <button id="buttonSignUp" class="firstButton" onclick="location.href='signup.html'">ثبت نام</button>
            <button id="introductionButton" class="firstButton" onclick="showCreateIntroduction()">معرفی محصول</button>
            <button id="showcaseButton" class="firstButton" onclick="showShowcase()">ویترین</button>
        </div>

        <script>checkAuth()</script>

        <div id="createIntroduction">
            <div id="editActionButtons">
                <button id="canselButton" onclick="canselIntroduction()">لغو</button>
                <button id="saveButton" onclick="saveIntroduction()">ذخیره</button>
            </div>

            <label>نام محصول</label><br>
            <input type="text" id="title" placeholder="نام محصول را وارد کنید"><br>

            <label>افزودن ویژگی</label><br>
            <input type="text" id="featuresInput" placeholder="ویژگی های محصول را بگویید">
            <button onclick="addFeature()">افزودن</button><br>

            <ul id="featuresIntroduction"></ul>

            <label>توضیح</label><br>
            <textarea rows="30" cols="100" id="explanation" placeholder="درباره محضول تان توضیح دهید"></textarea><br>

            <input type="file" accept="image/*" id="imageInput">
            <label for="imageInput" id="imagesLabel" onclick="createImageIntroduction()">تصاویر تان را وارد کنید</label>

            <div id="imagesIntroduction"></div>
        </div>

        <div id="showcase">
            <button class="backOfPage" onclick="hideShowcase()">برگشت</button>
        </div>

    </body>
</html>
